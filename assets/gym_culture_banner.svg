<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="gym-banner-title gym-banner-desc">
  <title id="gym-banner-title">Gym Culture Banner</title>
  <desc id="gym-banner-desc">Stylized gym scene showing modern comfort-focused fitness culture with neon highlights.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" rx="32" fill="url(#bg-grad)" />
  <rect x="80" y="80" width="1040" height="470" rx="28" fill="#111827" opacity="0.95" />
  <rect x="100" y="120" width="620" height="340" rx="28" fill="#1f2937" opacity="0.9" />
  <rect x="760" y="160" width="320" height="340" rx="28" fill="#111827" opacity="0.92" />

  <g fill="none" stroke="#94a3b8" stroke-width="14" stroke-linecap="round">
    <path d="M160 240h420" />
    <path d="M260 340h180" />
    <path d="M420 180v220" />
    <path d="M560 180v220" />
  </g>

  <rect x="880" y="220" width="120" height="180" rx="18" fill="#0f172a" stroke="url(#accent-grad)" stroke-width="10" />
  <path d="M900 180c20-30 52-48 88-48s68 18 88 48" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  <line x1="920" y1="420" x2="920" y2="560" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
  <line x1="980" y1="420" x2="980" y2="560" stroke="#c084fc" stroke-width="14" stroke-linecap="round" />

  <g fill="#f8fafc" font-family="Inter, sans-serif">
    <text x="120" y="520" font-size="54" font-weight="800">Gym Culture Shift</text>
    <text x="120" y="570" font-size="24" fill="#94a3b8">From gritty workouts to comfort-first fitness.</text>
  </g>

  <g fill="#e2e8f0" font-family="Inter, sans-serif" font-size="18">
    <text x="780" y="420">Intensity</text>
    <text x="780" y="470">Comfort</text>
    <line x1="900" y1="440" x2="1020" y2="440" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />
    <line x1="900" y1="490" x2="980" y2="490" stroke="#c084fc" stroke-width="18" stroke-linecap="round" />
  </g>
</svg>
